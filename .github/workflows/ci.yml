name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  js:
    name: js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: install JS dependencies
        run: npm ci
      - name: typecheck
        run: npx tsc --noEmit
      - name: unit tests
        run: npm test -- --ci

  android:
    name: android
    runs-on: [self-hosted, macOS, ARM64]
    # The `@react-native-oh-tpl/*` packages are HarmonyOS-only: they ship no
    # Android sources, yet RN 0.86's autolinking emits package imports for
    # them, so assembleDebug cannot link. Android is not a shipped target of
    # this port yet (no CameraX scan page either); keep the job visible but
    # non-blocking until it is.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: install JS dependencies
        run: npm ci
      - name: point Gradle at the local Android SDK
        # ANDROID_HOME is provided by the runner; local.properties is gitignored.
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: assemble debug APK
        working-directory: android
        env:
          # The RN 0.86 settings plugin pulls org.gradle.toolchains:foojay-resolver,
          # which needs a JVM 17+; the runner's default JDK is 11.
          JAVA_HOME: /Users/liangyuanyuan-iri/Library/Java/JavaVirtualMachines/corretto-17.0.20/Contents/Home
        run: ./gradlew --no-daemon :app:assembleDebug

  ios:
    name: ios
    # Disabled until the runner has an Xcode that can build RN 0.72.5. The
    # installed Xcode 27 requires a deployment target >= 15.0 (the project and
    # Pods are at 12.4) and its clang rejects RN 0.72's Yoga/glog sources. Once
    # Xcode 15/16 is installed and selected, remove this guard; the steps below
    # (bundle install + bundle exec pod install) are ready for that toolchain.
    if: ${{ false }}
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - name: install JS dependencies
        run: npm ci
      - name: install Ruby dependencies
        run: bundle install
      - name: install CocoaPods
        working-directory: ios
        run: bundle exec pod install
      - name: build for the iPhone simulator
        working-directory: ios
        run: |
          xcodebuild -workspace KmpPlaygroundRn.xcworkspace \
            -scheme KmpPlaygroundRn \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/ios-dd" \
            CODE_SIGNING_ALLOWED=NO build

  harmony:
    name: harmony
    runs-on: [self-hosted, macOS, ARM64]
    env:
      # Required by the CAPI architecture enabled in pages/Index.ets. The rest
      # of the DevEco environment (DEVECO_HOME, DEVECO_SDK_HOME, hvigor, ohpm,
      # node) is provided by the runner.
      RNOH_C_API_ARCH: "1"
    steps:
      - uses: actions/checkout@v4
      - name: install JS dependencies
        # A shared npm cache left node_modules without `react`/`jpeg-js` even
        # though the lock lists them, so this job installs through its own
        # cache dir rather than reusing the runner's.
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: npm ci
      - name: bundle the JS for HarmonyOS
        # Must run before assembleHap. bundle.harmony.js is a gitignored build
        # product; without it the installed HAP only shows the red screen
        # "None of the provided JSBundlePath(s) ... Is Metro server running?".
        run: npm run dev -- --reset-cache
      - name: install the RNOH har
        working-directory: harmony
        run: ohpm install --all
      - name: generate the Fabric component and TurboModule boilerplate
        # hvigor does not run `codegen-harmony`; the app's own `ScannerView`
        # component descriptor and descriptor wrapper come from here, and
        # cpp/generated is gitignored.
        run: npm run codegen:harmony
      - name: add the generated type stub the ble-plx har imports
        # This app has no RNOH codegen (see docs/harmony-setup.md), but the
        # adapted ble-plx har imports `@rnoh/react-native-openharmony/generated/ts`
        # for `TM.BlePlx.Spec`. The script writes that one type-only file into
        # the ohpm-installed RNOH har; it is a build product, not source.
        run: node scripts/inject-rnoh-codegen-stub.js
      - name: assemble the HAP (unsigned compile gate)
        # The runner has no signing material. hvigor skips signing when
        # signingConfigs is empty and still produces the unsigned HAP.
        working-directory: harmony
        run: hvigorw --mode module -p product=default -p buildMode=debug assembleHap --no-daemon
      - name: verify the unsigned HAP exists
        run: |
          hap=harmony/entry/build/default/outputs/default/entry-default-unsigned.hap
          test -s "$hap"
          echo "unsigned HAP: $hap ($(wc -c < "$hap") bytes)"

  # Merge the agent's own pull requests once every build gate is green. Operator
  # PRs are deliberately excluded: a person opening a PR is asking for review,
  # not for it to land on its own, and those get merged by hand.
  merge:
    name: merge
    # `android` is continue-on-error (the HarmonyOS-only packages carry no
    # Android sources), so requiring it here would skip every auto-merge.
    needs: [js, harmony]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'supermanlyy163' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: merge pull request
        run: gh pr merge "$PR" --merge --delete-branch --repo "$REPO"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
